name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^4.0.2
  connectivity_plus: ^7.3.1
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  forui: ^0.27.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  hive_ce_flutter: ^2.3.4
  hydrated_bloc: ^11.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.4.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  retrofit: ^4.10.0
  share_plus: ^13.3.0
  shimmer: ^4.0.0
  talker: ^5.1.20
  talker_bloc_logger: ^5.1.20
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.20
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  forui_cli: ^0.27.0
  hive_ce_generator: ^1.11.3
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.12

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

  adaptive_icon_background: "#1447E6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter_native_splash:
  color: "#1447e6"

  image_android: "assets/splash/android/splash.png"
  image_ios: "assets/splash/ios/splash.png"
  image_web: "assets/splash/web/splash.png"

  branding_android: "assets/splash/android/branding.png"
  branding_ios: "assets/splash/ios/branding.png"
  branding_web: "assets/splash/web/branding.png"

  android_12:
    color: "#1447e6"
    image: "assets/splash/android12/splash.png"
    branding: "assets/splash/android12/branding.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - ".env"
    - "assets/icon/icon.png"
